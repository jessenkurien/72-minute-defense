[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seventytwo"
version = "0.1.0"
description = "Reference implementation for governed, pre-authorized ransomware containment measured against a 72-minute exfiltration benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jessen Kurien" }]
keywords = [
  "ransomware",
  "incident-response",
  "incident-command",
  "ransomware-containment",
  "policy-as-code",
  "security-automation",
  "security-orchestration",
  "itdr",
  "xdr",
  "soar",
  "ciso",
  "grc",
  "nist-csf",
  "tabletop-exercise",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["build>=1.2,<2", "pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.5,<1", "boto3>=1.34,<2"]

[project.urls]
Homepage = "https://github.com/jessenkurien/72-minute-defense"
Repository = "https://github.com/jessenkurien/72-minute-defense"
Issues = "https://github.com/jessenkurien/72-minute-defense/issues"

[project.scripts]
72md = "seventytwo.cli:main"

[tool.setuptools.packages.find]
include = ["seventytwo*"]

[tool.setuptools.package-data]
seventytwo = ["data/*.yaml", "data/scenarios/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702"]
