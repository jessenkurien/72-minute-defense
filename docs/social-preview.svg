<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">The 72-Minute Defense</title>
  <desc id="desc">Open-source incident-response governance for pre-authorized ransomware containment, created by Jessen Kurien.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.62" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1040" cy="315" r="270" fill="url(#glow)"/>
  <path d="M0 78H1280M0 562H1280" stroke="#25324a" stroke-width="1"/>
  <path d="M70 0V640M1210 0V640" stroke="#25324a" stroke-width="1"/>

  <g transform="translate(960 320)" filter="url(#shadow)">
    <circle r="176" fill="#0d192c" stroke="#2a78d6" stroke-width="3"/>
    <circle r="145" fill="none" stroke="#253b5d" stroke-width="18"/>
    <path d="M0 -145 A145 145 0 1 1 -137.9 -44.8" fill="none" stroke="#ec835a" stroke-width="18" stroke-linecap="round"/>
    <g stroke="#8ca7cc" stroke-width="3">
      <path d="M0-154V-137"/><path d="M154 0H137"/><path d="M0 154V137"/><path d="M-154 0H-137"/>
    </g>
    <text x="0" y="18" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="92" font-weight="800" fill="#fff">72</text>
    <text x="0" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4" fill="#9fb5d2">MINUTES</text>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="88" y="98" width="424" height="34" rx="17" fill="#132743" stroke="#315987"/>
    <text x="108" y="121" font-size="15" font-weight="700" letter-spacing="2.2" fill="#8fbff2">OPEN-SOURCE INCIDENT-RESPONSE GOVERNANCE</text>

    <text x="86" y="220" font-size="68" font-weight="800" fill="#fff">THE 72-MINUTE</text>
    <text x="86" y="294" font-size="68" font-weight="800" fill="#fff">DEFENSE</text>

    <text x="90" y="352" font-size="22" font-weight="650" letter-spacing="1.3" fill="#ec835a">AUTHORITY  →  DETECTION  →  CONTAINMENT  →  EVIDENCE</text>
    <text x="90" y="409" font-size="24" fill="#c8d3e3">Pre-authorize safe action before the incident.</text>
    <text x="90" y="444" font-size="24" fill="#c8d3e3">Rehearse whether it is fast enough.</text>

    <text x="90" y="526" font-size="18" font-weight="700" fill="#fff">Created by Jessen Kurien</text>
    <text x="90" y="554" font-size="16" fill="#8fa2bb">github.com/jessenkurien/72-minute-defense</text>
  </g>
</svg>
